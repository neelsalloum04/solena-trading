<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>L'Eau Vive – Chili con carne</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
html,body{margin:0;background:#111}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Baloo 2',sans-serif;background:#9cc893}
.abs{position:absolute}

#tex{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .4  0 0 0 0 .22  0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px),repeating-linear-gradient(0deg,rgba(0,40,0,.035) 0 2px,transparent 2px 8px)}

.lid{position:absolute;left:45px;top:45px;width:810px;height:810px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffbf82 0%,#f5822f 35%,#de6119 70%,#b8470e 100%);box-shadow:0 40px 60px rgba(30,60,20,.45),inset 0 0 0 26px rgba(255,255,255,.08),inset 0 0 0 30px rgba(120,40,0,.25)}

.pc{position:absolute}

.pepper{width:30px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ff6047,#c4221a);box-shadow:0 2px 3px rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.25)}
.beef{background:#ea938e;box-shadow:inset -3px -3px 0 rgba(0,0,0,.13),0 2px 3px rgba(0,0,0,.22)}
.spice{border-radius:50%}
.bean{width:36px;height:22px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#c0525a,#6e1a20 72%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.corn{width:16px;height:15px;border-radius:40%;background:radial-gradient(circle at 35% 30%,#fff4a8,#f2b81f 72%);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.chunk{width:24px;height:20px;border-radius:6px;background:linear-gradient(135deg,#d8382a,#9d1b12)}
.oil{position:absolute;left:95px;top:110px;width:470px;height:430px;border-radius:48% 52% 55% 45%/50% 46% 54% 50%;background:radial-gradient(circle at 42% 38%,rgba(255,230,120,.75),rgba(214,168,30,.55) 45%,rgba(190,140,20,.35) 75%,rgba(190,140,20,0) 100%)}
.sauce{position:absolute;left:-30px;top:-30px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle at 46% 40%,#df4a30,#b92c1b 55%,#8e1c12 100%)}

.bowl{position:absolute;width:236px;height:236px;border-radius:50%;z-index:20;background:radial-gradient(circle at 38% 32%,#a9d6a0,#6fae66 60%,#4f8c48);box-shadow:0 22px 30px rgba(20,50,20,.35)}
.bowl .in{position:absolute;inset:24px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fbf7ee,#e9e1d0);box-shadow:inset 0 8px 16px rgba(0,0,0,.2)}
.bowl .liq{position:absolute;inset:10px;border-radius:50%}
#spoon,.sspoon{position:absolute;z-index:18}
.wisp{position:absolute;border-radius:50%;z-index:30;background:radial-gradient(circle,rgba(255,255,255,.85) 0%,rgba(255,255,255,.35) 40%,rgba(255,255,255,0) 70%)}
#timer{position:absolute;left:420px;top:1545px;width:240px;height:240px;z-index:25}
#timerTxt{position:absolute;left:390px;top:1795px;width:300px;text-align:center;z-index:25;font-weight:800;font-size:58px;color:#fff;background:#2e7d32;border-radius:40px;line-height:84px;box-shadow:0 10px 18px rgba(20,60,20,.3)}
#plateWrap{position:absolute;left:130px;top:670px;width:820px;height:820px;z-index:6}
.plate{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#f1f1ec 60%,#d9dbd2);box-shadow:0 34px 50px rgba(30,60,20,.38)}
.well{position:absolute;left:90px;top:90px;width:640px;height:640px;border-radius:50%;background:#f7f7f2;box-shadow:inset 0 10px 24px rgba(0,0,0,.12),0 0 0 3px rgba(120,160,110,.35)}
.food{position:absolute;left:110px;top:110px;width:600px;height:600px;border-radius:50%;overflow:hidden}
.half{position:absolute;inset:0}
.grain{position:absolute;width:17px;height:7px;border-radius:50%;background:linear-gradient(#ffffff,#ece6d6);box-shadow:0 1px 1px rgba(0,0,0,.12)}
.leaf{position:absolute;z-index:3}
#cap{position:absolute;left:0;top:215px;width:1080px;height:420px;z-index:50}
.capItem{position:absolute;left:40px;width:1000px;top:0;text-align:center}
.row{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:6px}
.lbl{background:#fff;color:#2e7d32;font-weight:800;font-size:40px;padding:2px 28px;border-radius:30px;box-shadow:0 6px 12px rgba(20,60,20,.25)}
.bio{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5cbf55,#2e8b32);border:6px solid #fff;color:#fff;font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 14px rgba(20,60,20,.3);line-height:1}
.txt{font-weight:800;font-size:100px;line-height:1.0;color:#fff;-webkit-text-stroke:20px #2e7d32;paint-order:stroke fill}
.txt span{display:inline-block;margin:0 12px}
.pac{font-family:'Pacifico',cursive;font-weight:400}
#logoS{position:absolute;left:34px;top:38px;z-index:55;background:rgba(255,255,255,.88);border-radius:28px;padding:10px 18px;box-shadow:0 8px 16px rgba(20,60,20,.2)}
#logoS img{width:160px;display:block}
#end{position:absolute;inset:0;z-index:60;background:radial-gradient(circle at 50% 42%,#ffffff 0%,#f4f8ec 45%,#d6ebc9 100%);clip-path:circle(0px at 540px 1080px)}
#end img{position:absolute;left:150px;top:520px;width:780px}
#endTxt{position:absolute;left:80px;width:920px;top:1110px;text-align:center;font-weight:700;font-size:66px;line-height:1.12;color:#2b5e2d}
#endTxt b{display:block;font-family:'Pacifico';font-weight:400;font-size:104px;color:#2e8b32;margin-top:18px}
</style></head><body>
<div id="stage">
 <div id="bg"></div><div id="tex"></div>
 <div id="decor"></div>
 <div id="potWrap">
  <div class="handle l"></div><div class="handle r"></div>
  <div class="rim"></div>
  <div class="inner"><div id="contents"></div></div>
  <div class="shade"></div>
  <div class="lid" id="lid"><div class="ring"></div><div class="knob"></div></div>
 </div>
 <div id="plateWrap"><div class="plate"></div><div class="well"></div><div class="food" id="food"></div><div id="leaves"></div></div>
 <div id="timer"><svg width="240" height="240" viewBox="0 0 240 240"><circle cx="120" cy="124" r="112" fill="rgba(20,60,20,.25)"/><circle cx="120" cy="118" r="112" fill="#fff"/><circle cx="120" cy="118" r="94" fill="#f3f7ef" stroke="#e85b2a" stroke-width="10"/><g id="ticks"></g><g id="hand"><rect x="114" y="38" width="12" height="86" rx="6" fill="#e85b2a"/></g><circle cx="120" cy="118" r="16" fill="#2e7d32"/></svg></div>
 <div id="timerTxt">20:00</div>
 <div id="cap"></div>
 <div id="logoS"><img src="assets/logo.png" alt=""></div>
 <div id="end"><img src="assets/logo@3x.png" alt=""><div id="endTxt">Tous les ingrédients de cette recette sont chez<b>L'Eau Vive</b></div></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
(async()=>{
await document.fonts.ready;
const $=s=>document.querySelector(s), stage=$('#stage'), potWrap=$('#potWrap'), contents=$('#contents');
let seed=11; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rnd()*(b-a), pick=a=>a[Math.floor(rnd()*a.length)];
const div=(c,p)=>{const d=document.createElement('div');d.className=c;p.appendChild(d);return d};
const disc=r=>{const a=R(0,6.283),d=r*Math.sqrt(rnd());return{x:Math.cos(a)*d,y:Math.sin(a)*d}};
const tl=gsap.timeline({paused:true});
const SFX=[]; const cue=(t,type,o={})=>SFX.push(Object.assign({t:+t.toFixed(3),type},o));
const layers={}; [['oil',1],['onion',2],['spice',3],['sauce',4],['gloss',4.5],['chunk',4.7],['pepper',5],['beef',6],['bean',7],['corn',8],['bub',9]].forEach(([k,z])=>{const l=div('layer',contents);l.style.zIndex=Math.round(z*10);layers[k]=l});

/* ---------- décor ---------- */
const SV={
tomato:`<svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="88" r="72" fill="#e23b2a"/><circle cx="85" cy="88" r="72" fill="url(#tg)"/><defs><radialGradient id="tg" cx=".35" cy=".3"><stop offset="0" stop-color="#ff8a6a"/><stop offset=".5" stop-color="#e23b2a" stop-opacity="0"/></radialGradient></defs><path d="M85 64 L95 40 L98 66 L122 58 L102 76 L118 96 L92 82 L85 108 L78 82 L52 96 L68 76 L48 58 L72 66 L75 40Z" fill="#3e8f37"/><circle cx="85" cy="74" r="7" fill="#2f6e2a"/></svg>`,
basil:`<svg width="150" height="90" viewBox="0 0 150 90"><path d="M8 45 C40 0 120 5 142 45 C120 85 40 90 8 45Z" fill="#3f9a3a"/><path d="M8 45 C40 0 120 5 142 45" fill="#58b552" opacity=".55"/><path d="M8 45 L140 45" stroke="#2a7428" stroke-width="3"/><path d="M40 45 L60 25 M70 45 L92 22 M100 45 L118 28 M40 45 L60 65 M70 45 L92 68 M100 45 L118 62" stroke="#2a7428" stroke-width="2" opacity=".6"/></svg>`,
chili:`<svg width="220" height="90" viewBox="0 0 220 90"><path d="M40 40 C80 20 150 25 205 70 C150 55 90 62 45 62 Z" fill="#d5241b"/><path d="M50 44 C90 30 150 34 190 60" stroke="#ff7a6a" stroke-width="5" fill="none" opacity=".6"/><path d="M44 38 C30 30 20 34 10 20 C22 28 34 26 46 34 C52 44 50 60 44 62 C36 56 36 46 44 38Z" fill="#3e8f37"/></svg>`,
garlic:`<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="68" r="52" fill="#f7f1e2"/><path d="M65 18 C40 40 40 100 65 120 M65 18 C90 40 90 100 65 120 M65 18 C20 50 25 100 50 116 M65 18 C110 50 105 100 80 116" stroke="#dccfb0" stroke-width="3" fill="none"/><circle cx="65" cy="68" r="52" fill="none" stroke="#e3d6b6" stroke-width="3"/><path d="M60 22 L65 4 L70 22Z" fill="#cdbd94"/></svg>`,
lime:`<svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="72" fill="#5fae3a"/><circle cx="80" cy="80" r="62" fill="#e6f5b0"/><circle cx="80" cy="80" r="56" fill="#b9e070"/><g stroke="#e6f5b0" stroke-width="5">${[0,1,2,3,4,5,6,7].map(i=>`<line x1="80" y1="80" x2="${80+56*Math.cos(i*.785)}" y2="${80+56*Math.sin(i*.785)}"/>`).join('')}</g><circle cx="80" cy="80" r="6" fill="#e6f5b0"/></svg>`,
pepcorn:`<svg width="90" height="70" viewBox="0 0 90 70">${[[15,20],[35,12],[52,30],[28,40],[70,22],[60,52],[42,58],[12,50]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#3a2a22"/><circle cx="${p[0]-2}" cy="${p[1]-2}" r="2.5" fill="#7a6250"/>`).join('')}</svg>`
};
const DEC=[['tomato',930,170,0],['basil',790,95,-25],['garlic',1020,520,20],['chili',985,1600,-120],['lime',140,1710,0],['basil',330,1840,30],['tomato',880,1790,40],['garlic',1010,1380,0],['chili',70,1520,60],['pepcorn',640,1860,0],['pepcorn',80,370,20],['basil',60,600,80],['pepcorn',990,690,0]];
const decEls=DEC.map(([k,x,y,r])=>{const d=div('decor',$('#decor'));d.innerHTML=SV[k];d.style.left=x+'px';d.style.top=y+'px';gsap.set(d,{xPercent:-50,yPercent:-50,rotation:r});return d});
decEls.forEach((d,i)=>{tl.from(d,{scale:0,rotation:'-=60',duration:.6,ease:'back.out(2)'},.15+i*.06);tl.to(d,{rotation:'+='+R(-10,10),y:R(-12,12),duration:40,ease:'sine.inOut'},.8)});

/* ---------- pièces ---------- */
const MK={
onion:p=>{const e=div('pc onion',p);return e}, garlic:p=>div('pc garlic',p), pepper:p=>{const e=div('pc pepper',p);e.style.width=R(22,34)+'px';return e},
beef:p=>{const e=div('pc beef',p),s=R(24,40);e.style.width=s+'px';e.style.height=s*R(.7,1)+'px';e.style.borderRadius=`${R(30,55)}% ${R(30,55)}% ${R(30,55)}% ${R(30,55)}%`;return e},
bean:p=>div('pc bean',p), corn:p=>div('pc corn',p), chunk:p=>div('pc chunk',p)
};
const place=(e,x,y)=>{e.style.left=x+'px';e.style.top=y+'px';gsap.set(e,{xPercent:-50,yPercent:-50,rotation:R(0,360)});return e};
function fall(e,tx,ty,sx,sy,t,d=.42){
 tl.fromTo(e,{x:sx-tx,y:sy-ty,opacity:0},{x:0,y:0,opacity:1,duration:d,ease:'power1.in'},t);
 tl.fromTo(e,{scale:2.3},{scale:1,duration:d+.3,ease:'bounce.out'},t);
}
function shake(t,a=7){[[-a,a*.5],[a*.8,-a*.4],[-a*.5,a*.3],[a*.3,-a*.2],[0,0]].forEach((p,i)=>tl.to(potWrap,{x:p[0],y:p[1],duration:.055,ease:'sine.inOut'},t+i*.055))}
function bowlStep(t,o){
 const side=o.side,bx=side>0?815:265,by=800;
 const b=div('bowl',stage);b.style.left=bx+'px';b.style.top=by+'px';const inn=div('in',b);
 let liq=null; if(o.fill){liq=div('liq',inn);liq.style.background=o.fill}
 const minis=[]; if(o.types) for(let i=0;i<16;i++){const ty=pick(o.types);minis.push(place(MK[ty](inn),R(45,143),R(45,143)))}
 gsap.set(b,{xPercent:-50,yPercent:-50});
 tl.fromTo(b,{x:side*680,y:-90,rotation:side*50},{x:0,y:0,rotation:0,duration:.5,ease:'back.out(1.5)'},t);
 tl.to(b,{rotation:-side*28,scaleX:.82,duration:.28,ease:'power2.inOut'},t+.5);
 if(minis.length) tl.to(minis,{opacity:0,scale:.6,duration:.25,stagger:.02},t+.6);
 if(liq) tl.to(liq,{scale:.15,opacity:0,duration:.6,ease:'power1.in'},t+.6);
 tl.to(b,{x:side*720,y:-60,rotation:side*40,scaleX:1,duration:.45,ease:'power2.in'},t+1.5);
 const dx=bx-540,dy=by-1080,L=Math.hypot(dx,dy),sx=330+dx/L*245,sy=330+dy/L*245;
 const out=[]; const n=o.n||0, spread=o.spread||.55;
 for(let i=0;i<n;i++){const ty=pick(o.types);const p=disc(o.r||285);const e=place(MK[ty](layers[o.layer||ty]),330+p.x,330+p.y);fall(e,330+p.x,330+p.y,sx,sy,t+.62+i*spread/n);out.push(e)}
 if(n) shake(t+.9,o.shake||7);
 cue(t,'whoosh'); if(o.cue) cue(t+.66,o.cue,{n,dur:spread});
 return {out,sx,sy};
}
let crot=0;
const spoon=div('',stage); spoon.id='spoon';
spoon.innerHTML=`<svg width="120" height="560" viewBox="0 0 120 560" style="position:absolute;left:-60px;top:-670px"><defs><linearGradient id="wd" x1="0" x2="1"><stop offset="0" stop-color="#b9783f"/><stop offset=".5" stop-color="#ebb57a"/><stop offset="1" stop-color="#a86a35"/></linearGradient></defs><rect x="46" y="0" width="28" height="430" rx="14" fill="url(#wd)"/><ellipse cx="60" cy="480" rx="50" ry="74" fill="url(#wd)"/><ellipse cx="60" cy="484" rx="36" ry="58" fill="#c98a50" opacity=".55"/></svg>`;
gsap.set(spoon,{left:540,top:1080,opacity:0,filter:'drop-shadow(0 18px 12px rgba(30,30,10,.35))'});
function stir(t,d=1.15){
 tl.fromTo(spoon,{opacity:0,rotation:-60,scale:1.15},{opacity:1,scale:1,duration:.2,immediateRender:false},t);
 tl.fromTo(spoon,{rotation:-60},{rotation:300,duration:d,ease:'power1.inOut',immediateRender:false},t);
 tl.fromTo(contents,{rotation:crot},{rotation:crot+360,duration:d,ease:'power1.inOut',immediateRender:false},t+.03); crot+=360;
 tl.to(spoon,{opacity:0,scale:1.12,duration:.2},t+d-.05);
 cue(t,'scrape',{dur:d});
}
function bubbles(t0,t1,n){for(let i=0;i<n;i++){const s=R(14,36),p=disc(270),e=div('bub',layers.bub);e.style.width=e.style.height=s+'px';place(e,330+p.x,330+p.y);const st=R(t0,t1-.35);
 tl.fromTo(e,{scale:0,opacity:1},{scale:1,duration:.28,ease:'power1.out'},st);tl.to(e,{scale:1.5,opacity:0,duration:.08},st+.28);gsap.set(e,{scale:0});cue(st+.28,'blub',{f:R(.8,1.3)})}}
function steam(t0,t1,cx,cy,sp,n,sz=180){for(let i=0;i<n;i++){const w=div('wisp',stage),s=sz*R(.8,1.3);w.style.width=w.style.height=s+'px';w.style.left=cx+R(-sp,sp)+'px';w.style.top=cy+R(-sp*.4,sp*.4)+'px';gsap.set(w,{xPercent:-50,yPercent:-50,opacity:0});
 const st=t0+(t1-t0)*i/n,d=R(1.6,2.4);tl.fromTo(w,{y:0,x:0,scale:.5},{y:-R(180,320),x:R(-70,70),scale:R(1.4,2.1),duration:d,ease:'sine.out',immediateRender:false},st);tl.to(w,{opacity:R(.4,.65),duration:d*.35},st);tl.to(w,{opacity:0,duration:d*.6,ease:'sine.in'},st+d*.4)}}
function caption(t,t2,lbl,text,o={}){
 const c=div('capItem',$('#cap'));
 c.innerHTML=(lbl?`<div class="row"><div class="lbl">${lbl}</div><div class="bio">BIO</div></div>`:'')+`<div class="txt ${o.cls||''}" style="${o.style||''}">${text.split(' ').map(w=>`<span>${w}</span>`).join('')}</div>`;
 if(o.top!=null)c.style.top=o.top+'px';
 gsap.set(c,{opacity:0});
 tl.set(c,{opacity:1},t);
 if(lbl){tl.from(c.querySelector('.lbl'),{y:-40,opacity:0,duration:.3,ease:'back.out(2)'},t);tl.from(c.querySelector('.bio'),{scale:0,rotation:-120,duration:.6,ease:'elastic.out(1,.5)'},t+.1)}
 tl.from(c.querySelectorAll('.txt span'),{scale:.2,opacity:0,y:30,duration:.42,ease:'back.out(2.6)',stagger:.07},t+.08);
 tl.to(c,{opacity:0,y:-30,scale:.92,duration:.25,ease:'power2.in'},t2-.25);
 cue(t+.08,'pop',{n:text.split(' ').length});
}

/* ---------- INTRO ---------- */
const logoS=$('#logoS'); tl.from(logoS,{x:-60,opacity:0,duration:.5,ease:'power2.out'},.3);
tl.fromTo(potWrap,{scale:1.6,opacity:0,rotation:-8},{scale:1,opacity:1,rotation:0,duration:.55,ease:'power3.in'},.2); shake(.75,10); cue(.74,'potdown');
gsap.set('#lid',{opacity:0}); gsap.set('#plateWrap',{x:1200}); gsap.set(['#timer','#timerTxt'],{scale:0});

 Object.assign(s.style,{left:bx-50+'px',top:by-305+'px',transformOrigin:'50px 305px',filter:'drop-shadow(0 14px 10px rgba(30,30,10,.35))'});
 gsap.set(s,{rotation:rot,opacity:0});tl.set(s,{opacity:1},t);tl.set(s,{opacity:0},t+1.36);const heap=s.querySelector('.heap');
 tl.fromTo(s,{x:(bx-540)*2.2,y:-520},{x:0,y:0,duration:.42,ease:'back.out(1.4)'},t);
 tl.to(s,{rotation:rot+38,scaleX:.75,duration:.22,ease:'power2.inOut'},t+.45);
 tl.to(heap,{scale:.1,opacity:0,transformOrigin:'50% 50%',duration:.35},t+.5);
 tl.to(s,{x:(bx-540)*2.2,y:-560,rotation:rot,scaleX:1,duration:.4,ease:'power2.in'},t+.95);
 const cx=bx-540+330,cy=by-1080+330, c=gsap.utils.splitColor(col);
 for(let i=0;i<44;i++){const e=div('pc spice',layers.spice),sz=R(5,12);e.style.width=e.style.height=sz+'px';const j=R(-25,25);e.style.background=`rgb(${c[0]+j|0},${c[1]+j|0},${c[2]+j|0})`;
  const g=(rnd()+rnd()+rnd()-1.5)*80,h=(rnd()+rnd()+rnd()-1.5)*80;place(e,cx+g,cy+h);fall(e,cx+g,cy+h,cx,cy,t+.5+i*.008,.3)}
 cue(t+.5,'powder');cue(t,'whoosh',{v:.5});
});

{const b=bowlStep(T.tom+.3,{side:1,fill:'radial-gradient(circle at 40% 35%,#ef5a3c,#b8281a 70%)',cue:null});
 const sc=div('sauce',layers.sauce);gsap.set(sc,{transformOrigin:`${b.sx+30}px ${b.sy+30}px`});

 for(let i=0;i<34;i++){const p=disc(290),e=place(MK.chunk(layers.chunk),330+p.x,330+p.y),dd=Math.hypot(330+p.x-b.sx,330+p.y-b.sy)/620;tl.from(e,{scale:0,duration:.3,ease:'back.out(2)'},T.tom+.95+dd*1.1)}
 [[150,140,170,60],[360,210,120,40],[230,420,150,50],[430,380,90,34],[120,330,80,30]].forEach(([x,y,w,h])=>{const g=div('gloss',layers.gloss);Object.assign(g.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});gsap.set(g,{rotation:-25});tl.from(g,{opacity:0,duration:.6},T.tom+1.9)});

steam(t1+.45,t1+1.3,540,1000,220,8,240); cue(t1+.45,'steam');

[[400,180,120,40],[440,380,90,30]].forEach(([x,y,w,h])=>{const g=div('gloss',chili);Object.assign(g.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'})});

 const st=T.plate+1.0+i*.05;tl.fromTo(l,{scale:3,opacity:0,y:-120,rotation:'-=90'},{scale:R(.8,1.15),opacity:1,y:0,rotation:'+=90',duration:.5,ease:'bounce.out'},st)}
